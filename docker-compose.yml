services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: spatialmind
      POSTGRES_PASSWORD: spatialmind
      POSTGRES_DB: spatialmind
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spatialmind"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: spatialmind
      MINIO_ROOT_PASSWORD: spatialmind123
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery-worker:
    image: python:3.11-slim
    working_dir: /app
    command: ["python", "-m", "celery", "-A", "spatialmind.batch.celery_app", "worker", "--loglevel=INFO", "--concurrency=8"]
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["batch"]

  flower:
    image: python:3.11-slim
    working_dir: /app
    command: ["python", "-m", "celery", "-A", "spatialmind.batch.celery_app", "flower", "--port=5555"]
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["batch"]
